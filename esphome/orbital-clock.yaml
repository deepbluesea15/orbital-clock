esphome:
  name: orbital-clock
  friendly_name: Orbital Clock
  includes:
    - custom_components/orbital_clock/faces
  libraries:
    - AsyncUDP
    - DNSServer
    - HTTPClient
    - Preferences
    - SPI
    - WebServer
    - Wire
    - WiFi
    - NetworkClientSecure
    - olikraus/U8g2@^2.36.17

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    advanced:
      enable_lwip_dhcp_server: true
      include_builtin_idf_components:
        - esp_event
        - esp_netif
        - esp_wifi

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ORBITAL-SETUP
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

select:
  - platform: template
    id: orbital_face
    name: Clock face
    optimistic: false
    restore_value: true
    initial_option: NEON
    options:
      - NEON
      - DIGITAL
      - ANALOG
      - FLIPCLOCK
      - WORDCLOCK
      - RAIN
      - DECRYPT
      - WEATHER
      - FORECAST
      - MOON
      - SOLAR
      - ORRERY
      - ORBIT
      - TERMINAL
      - FLYOVER
      - TESSERACT
      - JELLYFISH
      - BOUNCE
    set_action:
      - lambda: id(clock_controller).set_face(x);

  - platform: template
    id: orbital_time_format
    name: Clock format
    optimistic: false
    restore_value: true
    initial_option: 12-hour
    options:
      - 12-hour
      - 24-hour
    set_action:
      - lambda: id(clock_controller).set_time_format(x);

  - platform: template
    id: orbital_units
    name: Weather units
    optimistic: false
    restore_value: true
    initial_option: Celsius
    options:
      - Celsius
      - Fahrenheit
    set_action:
      - lambda: id(clock_controller).set_units(x);

  - platform: template
    id: orbital_timezone
    name: Time zone
    optimistic: false
    restore_value: true
    initial_option: Automatic
    options:
      - Automatic
      - America/New_York
      - America/Detroit
      - America/Toronto
      - America/Chicago
      - America/Denver
      - America/Phoenix
      - America/Los_Angeles
      - America/Vancouver
      - America/Anchorage
      - Pacific/Honolulu
      - America/Mexico_City
      - America/Sao_Paulo
      - Europe/London
      - Europe/Lisbon
      - Europe/Paris
      - Europe/Berlin
      - Europe/Madrid
      - Europe/Rome
      - Europe/Amsterdam
      - Europe/Warsaw
      - Europe/Athens
      - Europe/Helsinki
      - Europe/Kyiv
      - Europe/Moscow
      - Asia/Dubai
      - Asia/Kolkata
      - Asia/Bangkok
      - Asia/Singapore
      - Asia/Shanghai
      - Asia/Hong_Kong
      - Asia/Tokyo
      - Asia/Seoul
      - Australia/Perth
      - Australia/Brisbane
      - Australia/Sydney
      - Pacific/Auckland
      - UTC
    set_action:
      - lambda: id(clock_controller).set_timezone(x);

text:
  - platform: template
    id: orbital_city
    name: Weather location
    mode: text
    max_length: 80
    optimistic: false
    restore_value: true
    set_action:
      - lambda: id(clock_controller).set_city(x);

button:
  - platform: template
    name: Reset clock settings
    on_press:
      - lambda: id(clock_controller).reset_settings();

external_components:
  - source:
      type: local
      path: custom_components
    components: [orbital_clock]

logger:
  baud_rate: 0

time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - time.nist.gov

orbital_clock:
  id: clock_controller
  face_select: orbital_face
  format_select: orbital_time_format
  units_select: orbital_units
  timezone_select: orbital_timezone
  city_text: orbital_city