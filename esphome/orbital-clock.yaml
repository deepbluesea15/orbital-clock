esphome:
  name: orbital-clock
  friendly_name: Orbital Clock
  libraries:
    - SPI
    - Wire
    - olikraus/U8g2@^2.36.17

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
    advanced:
      enable_lwip_dhcp_server: true
      include_builtin_idf_components:
        - esp_event
        - esp_netif
        - esp_wifi

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  on_connect:
    - lambda: id(clock_controller).network_connected();
  ap:
    ssid: ORBITAL-SETUP
    password: !secret fallback_ap_password

captive_portal:

preferences:
  flash_write_interval: 5s

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:

binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 10ms
    on_press:
      then:
        - lambda: id(clock_controller).boot_button_pressed();
        - delay: 800ms
        - if:
            condition:
              binary_sensor.is_on: boot_button
            then:
              - lambda: id(clock_controller).boot_button_format_hold();
              - delay: 7200ms
              - if:
                  condition:
                    binary_sensor.is_on: boot_button
                  then:
                    - if:
                        condition:
                          lambda: return id(clock_controller).boot_button_factory_reset();
                        then:
                          - delay: 1400ms
                          - button.press: orbital_restart
    on_release:
      then:
        - lambda: id(clock_controller).boot_button_released();

select:
  - platform: template
    id: orbital_face
    name: Clock face
    optimistic: false
    restore_value: true
    initial_option: NEON
    options:
      - NEON
      - DIGITAL
      - ANALOG
      - FLIPCLOCK
      - WORDCLOCK
      - RAIN
      - DECRYPT
      - WEATHER
      - FORECAST
      - MOON
      - SOLAR
      - ORRERY
      - ORBIT
      - TERMINAL
      - FLYOVER
      - TESSERACT
      - JELLYFISH
      - BOUNCE
    set_action:
      - lambda: id(clock_controller).set_face(x);

  - platform: template
    id: orbital_time_format
    name: Clock format
    optimistic: false
    restore_value: true
    initial_option: 12-hour
    options:
      - 12-hour
      - 24-hour
    set_action:
      - lambda: id(clock_controller).set_time_format(x);

  - platform: template
    id: orbital_units
    name: Weather units
    optimistic: false
    restore_value: true
    initial_option: Celsius
    options:
      - Celsius
      - Fahrenheit
    set_action:
      - lambda: id(clock_controller).set_units(x);

  - platform: template
    id: orbital_timezone
    name: Time zone
    optimistic: false
    restore_value: true
    initial_option: Automatic
    options:
      - Automatic
      - America/New_York
      - America/Detroit
      - America/Toronto
      - America/Chicago
      - America/Denver
      - America/Phoenix
      - America/Los_Angeles
      - America/Vancouver
      - America/Anchorage
      - Pacific/Honolulu
      - America/Mexico_City
      - America/Sao_Paulo
      - Europe/London
      - Europe/Lisbon
      - Europe/Paris
      - Europe/Berlin
      - Europe/Madrid
      - Europe/Rome
      - Europe/Amsterdam
      - Europe/Warsaw
      - Europe/Athens
      - Europe/Helsinki
      - Europe/Kyiv
      - Europe/Moscow
      - Asia/Dubai
      - Asia/Kolkata
      - Asia/Bangkok
      - Asia/Singapore
      - Asia/Shanghai
      - Asia/Hong_Kong
      - Asia/Tokyo
      - Asia/Seoul
      - Australia/Perth
      - Australia/Brisbane
      - Australia/Sydney
      - Pacific/Auckland
      - UTC
    set_action:
      - lambda: id(clock_controller).set_timezone(x);

text:
  - platform: template
    id: orbital_city
    name: Weather location
    mode: text
    max_length: 80
    optimistic: false
    restore_value: true
    set_action:
      - lambda: id(clock_controller).set_city(x);

number:
  - platform: template
    id: orbital_day_brightness
    name: Day brightness
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    optimistic: true
    restore_value: true

  - platform: template
    id: orbital_night_brightness
    name: Night brightness
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 12
    optimistic: true
    restore_value: true

  - platform: template
    id: orbital_rotation_interval
    name: Face rotation interval
    unit_of_measurement: min
    min_value: 0
    max_value: 1440
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true

datetime:
  - platform: template
    type: time
    id: orbital_night_start
    name: Night dimming starts
    initial_value: "22:00:00"
    optimistic: true
    restore_value: true

  - platform: template
    type: time
    id: orbital_night_end
    name: Night dimming ends
    initial_value: "07:00:00"
    optimistic: true
    restore_value: true

button:
  - platform: restart
    id: orbital_restart
    internal: true

  - platform: template
    name: Reset clock settings
    on_press:
      - lambda: id(clock_controller).reset_settings();

external_components:
  - source:
      type: git
      url: https://github.com/arikalish/orbital-clock-esphome.git
      ref: main
      path: esphome/custom_components
    components: [orbital_clock, orbital_clock_faces]
    refresh: always

logger:
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG

time:
  - platform: sntp
    id: sntp_time
    servers:
      - pool.ntp.org
      - time.nist.gov

sun:
  id: orbital_sun
  time_id: sntp_time
  # WeatherService replaces these defaults with the cached/geocoded location.
  latitude: 0
  longitude: 0

http_request:
  id: weather_http
  timeout: 10s
  verify_ssl: true

orbital_clock:
  id: clock_controller
  face_select: orbital_face
  format_select: orbital_time_format
  units_select: orbital_units
  timezone_select: orbital_timezone
  city_text: orbital_city
  day_brightness: orbital_day_brightness
  night_brightness: orbital_night_brightness
  night_start: orbital_night_start
  night_end: orbital_night_end
  rotation_interval: orbital_rotation_interval
  time_id: sntp_time
  http_request_id: weather_http
  sun_id: orbital_sun